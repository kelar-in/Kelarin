<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelarin - Student Productivity App</title>
  
  <!-- Manifest & Logo PWA Kelarin -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%234F46E5'/><g fill='none' stroke='%23FFFFFF' stroke-linecap='round' stroke-linejoin='round'><line x1='160' y1='120' x2='160' y2='392' stroke-width='48'/><line x1='160' y1='260' x2='310' y2='130' stroke-width='48'/><path d='M 230 290 L 300 360 L 410 210' stroke='%2310B981' stroke-width='52'/></g></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%234F46E5'/><g fill='none' stroke='%23FFFFFF' stroke-linecap='round' stroke-linejoin='round'><line x1='160' y1='120' x2='160' y2='392' stroke-width='48'/><line x1='160' y1='260' x2='310' y2='130' stroke-width='48'/><path d='M 230 290 L 300 360 L 410 210' stroke='%2310B981' stroke-width='52'/></g></svg>">
  
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #4F46E5; }
    #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; text-align: center; }
    #app-container { width: 100%; height: 100%; border: none; display: none; }
  </style>
</head>
<body>

  <div id="loader">
    <div style="width: 64px; height: 64px; margin-bottom: 16px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full">
        <rect width="512" height="512" rx="128" fill="#4F46E5"/>
        <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
          <line x1="160" y1="120" x2="160" y2="392" stroke-width="48"/>
          <line x1="160" y1="260" x2="310" y2="130" stroke-width="48"/>
          <path d="M 230 290 L 300 360 L 410 210" stroke="#10B981" stroke-width="52"/>
        </g>
      </svg>
    </div>
    <p style="font-weight: bold; font-size: 14px;">Membuka Kelarin...</p>
  </div>

  <iframe id="app-container" allow="clipboard-read; clipboard-write; notifications" allowfullscreen></iframe>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT AKHIRAN /exec DI SINI
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXw1xHcsAq9SR7zk2pILeO4QpEFJOiNjZhxEZYr0DAMK5xXixNx_tYaE2KBmoFqOAW/exec";

    // Memuat konten secara aman tanpa terblokir domain
    fetch(APPS_SCRIPT_URL)
      .then(response => response.text())
      .then(html => {
        // Menyuntikkan base href agar asset & script berjalan relatif aman
        const baseTag = `<base href="${APPS_SCRIPT_URL}">`;
        const updatedHtml = html.replace('<head>', '<head>' + baseTag);
        
        const blob = new Blob([updatedHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        
        const frame = document.getElementById('app-container');
        frame.src = blobUrl;
        
        document.getElementById('loader').style.display = 'none';
        frame.style.display = 'block';
      })
      .catch(err => {
        // Fallback jika fetch terhalang CORS
        window.location.href = APPS_SCRIPT_URL;
      });
  </script>
</body>
</html>
